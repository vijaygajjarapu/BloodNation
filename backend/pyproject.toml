[project]
name = "bloodnation-backend"
version = "0.1.0"
description = "Blood Nation backend foundation (Django). No product features yet."
requires-python = ">=3.13,<3.14"
dependencies = [
    "django>=5.2,<5.3",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-django",
    "ruff",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
